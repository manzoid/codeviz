# Build codeviz's container-backend images and push them, multi-arch, to GHCR.
#
# End users then `docker pull` a prebuilt image instead of building locally
# (the backends try the pinned GHCR tag first, falling back to a local build).
#
# Versioning: each image has a pinned tag (":1"). When you change a Dockerfile
# or tracer, bump BOTH the `version` here AND the GHCR ref in the matching
# backend (codeviz/backends/*_backend.py) so users pull the updated image.
#
# NOTE (one-time): images pushed by Actions start PRIVATE. For anonymous
# `docker pull` (no login for users), set each package's visibility to Public
# once at https://github.com/users/manzoid/packages
name: images

on:
  push:
    branches: [main]
    paths:
      - "codeviz/docker/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: codeviz-c-cpp, context: codeviz/docker/c_cpp, version: "1" }
          - { name: codeviz-java, context: codeviz/docker/java, version: "1" }
          - { name: codeviz-asm-x86, context: codeviz/docker/asm, version: "1" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
